# fly.toml app configuration file generated for clinic-backend-1234 on 2026-07-05T05:53:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clinic-backend-1234'
primary_region = 'iad'

[build]

[env]
NODE_ENV = "production"
PORT = "8080"
DB_SYNC = "false"
TURN_MODE = "metered"
JWT_EXPIRE_MINUTES = "1440"
JWT_REFRESH_EXPIRE_MINUTES = "10080"
MEETING_SKIP_JOIN_WINDOW_CHECK = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
